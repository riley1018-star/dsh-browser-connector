<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  :root { color-scheme: light dark; }
  body {
    width: 300px; margin: 0; padding: 14px 16px;
    font: 13px/1.5 -apple-system, "PingFang SC", sans-serif;
    background: #fff; color: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #e8e8ea; }
    .row { background: #2a2a2e !important; }
    button { background: #3a3a40 !important; color: #e8e8ea !important; }
  }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #999; flex: none; }
  .dot.on { background: #2ecc71; box-shadow: 0 0 6px #2ecc7188; }
  .dot.half { background: #f39c12; }
  .row { background: #f2f3f5; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; word-break: break-all; }
  .k { color: #6a737d; }
  button {
    width: 100%; padding: 7px 0; border: 0; border-radius: 8px;
    background: #4f46e5; color: #fff; font-size: 13px; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .err { color: #e74c3c; }
</style>
</head>
<body>
  <h1><span id="dot" class="dot"></span>DSH Browser Connector</h1>
  <div class="row"><span class="k">状态：</span><span id="state">检查中…</span></div>
  <div class="row" id="errRow" style="display:none"><span class="k err">最近错误：</span><span class="err" id="err"></span></div>
  <div class="row"><span class="k">扩展 ID：</span><span id="extid"></span></div>
  <div class="row"><span class="k">调试中的标签页：</span><span id="dbgtabs">无</span></div>
  <button id="reconnect">重新连接</button>
  <script src="popup.js"></script>
</body>
</html>
